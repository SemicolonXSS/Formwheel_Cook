<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formwheel Cook Battle</title><link rel="icon" href="https://semicolonxss.github.io/Formwheel/assets/formwheel-favicon.svg"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#243047;background:#f7f8fc}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dae1eb;padding:14px max(16px,calc((100vw - 1050px)/2))}a{color:#5267d5;text-decoration:none}main{max-width:1050px;margin:22px auto;padding:0 16px}.panel{padding:20px;background:#fff;border:1px solid #e1e6ed;border-radius:18px;margin:14px 0;box-shadow:0 3px 20px #2736540b}h1{margin:0 0 8px}p{color:#626b79}input{border:1px solid #ccd3e1;border-radius:10px;padding:12px;font-size:16px;max-width:100%}button{border:0;border-radius:12px;background:#5267d5;color:white;padding:12px 16px;font-size:15px;cursor:pointer;margin:4px}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#eef1ff;color:#3445a2}.hidden{display:none}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.stat{padding:13px;border-radius:12px;background:#f2f5fb;flex:1;min-width:140px}.num{font-size:30px;font-weight:800}#timer{font-variant-numeric:tabular-nums}.status{white-space:pre-wrap;background:#fff7e9;padding:10px;border-radius:9px}iframe{width:100%;height:760px;border:1px solid #dee2ed;border-radius:12px;background:white}#tap{font-size:33px;font-weight:800;min-height:170px;width:100%;margin:16px 0;background:#fe8b4b}#tap:active{transform:scale(.99)}@media(max-width:600px){iframe{height:780px}.num{font-size:24px}.panel{padding:14px}main{padding:0 10px}}.meter{height:14px;border-radius:100px;background:#e8edf6;overflow:hidden;margin:6px 0}.meter>span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb36a,#f4773b);transition:width .35s}.meter.rival>span{background:linear-gradient(90deg,#8da1f9,#5267d5)}.finish{border:2px solid #f6bf89;background:#fff8ed;border-radius:14px;padding:16px;margin-top:12px;font-size:17px}.finish[hidden]{display:none}#timer.urgent{color:#d52936;animation:pulse .8s infinite alternate}@keyframes pulse{to{opacity:.5}}#countdown{font-weight:800;color:#c45d20}#play[hidden]{display:none}</style></head><body>
<header><a href="./">← Cook 일반 모드</a> · <a href="https://semicolonxss.github.io/Formwheel/">Formwheel Hub</a></header><main><h1>🍳 요리 배틀</h1><p>같은 랜덤 재료와 매판 바뀌는 배점표로 대결! 요리는 1회만 제출할 수 있어요.</p>
<section class="panel" id="join"><label>닉네임 <input id="name" maxlength="14" placeholder="플레이어"></label><div class="row"><button id="create">방 만들기</button><input id="codeInput" maxlength="6" placeholder="6자리 방 코드" style="text-transform:uppercase"><button id="enter" class="secondary">방 참가</button></div><p id="joinStatus"></p></section>
<section class="panel hidden" id="room"><div class="row"><strong>방 코드: <span id="roomCode"></span></strong><button class="secondary" id="copy">코드 복사</button><button class="secondary" id="leave">방 나가기</button></div><div class="row"><div class="stat">나: <b id="myName"></b><div class="num" id="myScore">0</div><div class="meter"><span id="myMeter"></span></div></div><div class="stat">상대: <b id="theirName">대기 중</b><div class="num" id="theirScore">0</div><div class="meter rival"><span id="theirMeter"></span></div></div><div class="stat">남은 시간<div class="num" id="timer">5:00</div></div></div><p id="phase"></p><p id="battleRules" class="status">시작하면 이번 판 재료와 배점이 공개됩니다.</p><p id="countdown" aria-live="polite"></p><button id="start" class="hidden">대결 시작</button><p class="status" id="message">상대를 기다리는 중...</p><div id="finishResult" class="finish" hidden aria-live="polite"></div></section>
<section class="panel hidden" id="play"><p>지정된 재료만 사용 가능해요. <b>최종 제출은 딱 한 번</b>! 제출 후 수정할 수 없습니다.</p><iframe id="kitchen" title="Cook 배틀 요리 플레이" src="./index.html?battleEmbed=1&v=20261013-restricted"></iframe></section>
</main><script type="module">
import {battleSession} from "./assets/battle-session.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getDatabase,ref,get,set,update,onValue,runTransaction,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
const app=initializeApp({apiKey:"AIzaSyBreTSe1m0-xlbF4aupnU5isRZCihR25IE",authDomain:"formwheel.firebaseapp.com",databaseURL:"https://formwheel-default-rtdb.firebaseio.com",projectId:"formwheel",appId:"1:431583088241:web:74e0e34ea1e3e1170c55d0"}),db=getDatabase(app),auth=getAuth(app),base="formwheelBattles/cook",duration=5*60000;
const session=battleSession("cook",db);
const pools=[
["물","스파게티 면","토마토 소스","양파","마늘","파프리카","양송이 버섯","올리브유","소금","후추","소고기","모짜렐라"],
["밥","달걀","당근","대파","양파","김치","두부","간장","참기름","소금","후추","햄"],
["식빵","또띠아","닭고기","오이","양상추","토마토","체다 치즈","마요네즈","머스터드","달걀","버터"],
["바나나","딸기","사과","블루베리","요거트","우유","꿀","생크림","초콜릿","시나몬","레몬"],
["감자","고구마","돼지고기","소고기","양파","양송이 버섯","브로콜리","당근","버터","소금","후추","바비큐 소스"],
["새우","오징어","우동 면","라면 사리","물","애호박","양파","대파","간장","고추장","소금","마늘"]
];
function random(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=random(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function makeRules(){return {allowed:shuffle(pools[random(pools.length)]).slice(0,10),weights:shuffle([15,20,20,20,25]),version:1}}
const rubric=["다양성","손질","혼합","익힘","균형"];

const $=id=>document.getElementById(id),id=session.id;
// Each tab is a separate participant, including two tabs of the same browser.
let code="",isHost=false,room=null,unsubscribe=null,published=-1,locked=false;
let score=0,money=0,power=1,auto=0,pc=20,ac=60,lastTick=Date.now(),cookStarted=false;
const safeName=s=>String(s||"플레이어").trim().slice(0,14)||"플레이어";
const roomRef=c=>ref(db,base+"/"+c);
function say(t){$("message").textContent=t}
function timeLeft(){return room?.startedAt?Math.max(0,duration-(session.now()-room.startedAt)):duration}
function active(){return room?.phase==="playing"&&timeLeft()>0}
function display(){if(!room)return;const me=room.players?.[id];const opponent=Object.entries(room.players||{}).find(([k])=>k!==id)?.[1];$("myName").textContent=(me?.name||"나")+(me?.submitted?" ✅":"");$("theirName").textContent=(opponent?.name||"대기 중")+(opponent?.submitted?" ✅":"");$("myScore").textContent=(me?.score||0).toLocaleString();$("theirScore").textContent=(opponent?.score||0).toLocaleString();$("roomCode").textContent=code;const rules=room.rules;$("battleRules").textContent=rules?"🧺 지정 재료: "+rules.allowed.join(" · ")+"\n📊 배점: "+rubric.map((x,i)=>x+" "+rules.weights[i]+"점").join(" · ")+"\n🍽️ 제출은 1회만 가능":"시작하면 이번 판 재료와 배점이 공개됩니다.";const remaining=Math.ceil(timeLeft()/1000);$("timer").textContent=Math.floor(remaining/60)+":"+String(remaining%60).padStart(2,"0");$("timer").classList.toggle("urgent",room.phase==="playing"&&remaining<=30);$("myMeter").style.width=Math.min(100,Math.max(0,Number(me?.score)||0))+"%";$("theirMeter").style.width=Math.min(100,Math.max(0,Number(opponent?.score)||0))+"%";$("countdown").textContent=room.phase==="playing"&&remaining<=30&&remaining>0?"🔥 마지막 "+remaining+"초!":"";$("start").classList.toggle("hidden",!isHost||room.phase!=="waiting"||Object.keys(room.players||{}).length!==2);$("play").classList.toggle("hidden",room.phase!=="playing");$("phase").textContent=room.phase==="waiting"?"대기실":room.phase==="playing"?"대결 진행 중":"대결 종료";
if(room.phase==="waiting")say("2명이 모이면 방장이 대결을 시작할 수 있어요.");
if(room.phase==="playing")say("현재 진행 중! 종료 시 더 높은 최고 점수가 승리합니다.");
$("finishResult").hidden=room.phase!=="finished";if(room.phase==="finished"){const players=Object.entries(room.players||{});const sorted=players.slice().sort((a,b)=>(b[1].score||0)-(a[1].score||0));const tie=sorted.length===2&&sorted[0][1].score===sorted[1][1].score;const winner=sorted[0]?.[0]===id;const mine=Number(me?.score)||0,theirs=Number(opponent?.score)||0;const verdict=sorted.length<2?"상대 퇴장 · 대결 종료":tie?"🤝 무승부!":winner?"🏆 승리!":"👏 상대 승리!";say(verdict);$("finishResult").textContent=verdict+" · 내 최고 "+mine+"점 / 상대 최고 "+theirs+"점"+(sorted.length===2?" · 점수 차 "+Math.abs(mine-theirs)+"점":"");}
}
function subscribe(c){unsubscribe?.();code=c;session.remember(c);$("join").classList.add("hidden");$("room").classList.remove("hidden");unsubscribe=onValue(roomRef(c),snap=>{const r=snap.val();if(!r){session.clear();alert("방이 종료되었습니다.");location.reload();return}room=r;if(!r.players?.[id]){session.clear();alert("방에서 퇴장했습니다.");location.reload();return}published=Math.max(published,Number(r.players[id].score)||0);isHost=r.host===id;if(r.phase==="playing"&&!cookStarted)resetBattleKitchen();if(r.players[id].submitted)lockKitchen(r.players[id].score);display()},err=>say("실시간 동기화 오류: "+err.message))}
async function authReady(){await auth.authStateReady();if(!auth.currentUser)await signInAnonymously(auth)}
function error(e){const msg=e?.code==="PERMISSION_DENIED"||e?.code==="permission-denied"?"Firebase Database Rules에서 formwheelBattles 경로 접근이 거부됐어요.":e?.code==="auth/operation-not-allowed"?"Firebase 익명 로그인이 비활성화되어 있어요.":e?.message||String(e);$("joinStatus").textContent="연결 실패: "+msg;console.error("Battle connection",e)}
$("create").onclick=async()=>{if(locked)return;locked=true;try{await authReady();let c;for(let i=0;i<6;i++){c=Array.from(crypto.getRandomValues(new Uint8Array(6)),x=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[x%32]).join("");const r=await runTransaction(roomRef(c),v=>v===null?{host:id,phase:"waiting",createdAt:session.now(),players:{[id]:{name:safeName($("name").value),score:0}}}:undefined,{applyLocally:false});if(r.committed){subscribe(c);return}}throw Error("방 코드 생성에 실패했어요.")}catch(e){error(e)}finally{locked=false}};
$("enter").onclick=async()=>{if(locked)return;locked=true;const button=$("enter");button.disabled=true;$("joinStatus").textContent="방을 확인하고 있어요…";try{
 await authReady();
 const c=$("codeInput").value.replace(/[\s-]/g,"").trim().toUpperCase();
 if(!/^[A-Z0-9]{6}$/.test(c))throw Error("6자리 방 코드를 입력하세요.");
 const target=roomRef(c);
 // Important: Firebase RTDB transactions may first run on an empty local cache.
 // Fetch the room before starting a transaction so an existing remote room
 // isn't mistaken for a nonexistent room and rejected immediately.
 const initial=(await get(target)).val();
 if(!initial)throw Error("이 코드의 방이 존재하지 않아요. 방장에게 새 코드를 확인해 주세요.");
 if(initial.players?.[id]){subscribe(c);return}
 if(initial.phase!=="waiting")throw Error(initial.phase==="playing"?"이미 시작된 방이에요.":"이미 종료된 방이에요.");
 if(!initial.players||Object.keys(initial.players).length>=2)throw Error("방 정원이 이미 찼어요 (2명).");
 const result=await runTransaction(target,current=>{
   // Return null for an empty cache so the server can retry with its current value.
   // Never recreate a room from the earlier read if it was deleted in between.
   if(current===null)return null;
   const existing=current;
   if(!existing||existing.phase!=="waiting"||!existing.players)return;
   if(existing.players[id])return existing;
   if(Object.keys(existing.players).length>=2)return;
   return {...existing,players:{...existing.players,[id]:{name:safeName($("name").value),score:0}}};
 },{applyLocally:false});
 if(!result.committed||!result.snapshot.val()?.players?.[id]){
   const newest=(await get(target)).val();
   if(!newest)throw Error("참가하는 동안 방이 삭제됐어요.");
   if(newest.phase!=="waiting")throw Error("참가하는 동안 대결이 시작되거나 종료됐어요.");
   if(Object.keys(newest.players||{}).length>=2)throw Error("참가하는 동안 방 정원이 찼어요.");
   throw Error("방 참가 트랜잭션이 취소됐어요. 한 번 더 눌러주세요.");
 }
 $("joinStatus").textContent="방 참가 완료!";
 subscribe(c);
 }catch(e){error(e)}finally{locked=false;button.disabled=false}};
$("start").onclick=async()=>{if(!isHost||!room||Object.keys(room.players||{}).length!==2)return;try{const r=await runTransaction(roomRef(code),v=>{if(v?.host!==id||v.phase!=="waiting"||Object.keys(v.players||{}).length!==2)return;v.phase="playing";v.startedAt=serverTimestamp();v.rules=makeRules();return v},{applyLocally:false});if(r.committed){score=money=0;power=1;auto=0;pc=20;ac=60;lastTick=Date.now();}}catch(e){say(e.message)}};
$("leave").onclick=async()=>{if(!code)return;try{await runTransaction(roomRef(code),v=>{if(!v?.players?.[id])return;delete v.players[id];if(!Object.keys(v.players).length)return null;if(v.host===id)v.host=Object.keys(v.players)[0];if(v.phase==="playing")v.phase="finished";return v},{applyLocally:false});session.clear();location.href="./index.html"}catch(e){say("퇴장 실패 · 다시 시도해 주세요: "+e.message)}};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(code)}catch{prompt("방 코드",code)}};
let desiredScore=-1,sendingScore=false;
async function publish(value){
 if(Number.isFinite(value))desiredScore=Math.max(desiredScore,Math.min(100,Math.max(0,value)));
 if(!active()||sendingScore||desiredScore<=published)return;
 const valueToSend=desiredScore;sendingScore=true;
 try{const result=await runTransaction(ref(db,base+"/"+code+"/players/"+id+"/score"),v=>Math.max(Number(v||0),valueToSend),{applyLocally:false});if(result.committed)published=Math.max(published,valueToSend)}
 catch(e){say("점수 저장 대기 중 · 연결 후 재시도합니다: "+e.message)}
 finally{sendingScore=false}
}
const kitchen=$("kitchen");let lastKitchenValue=null,kitchenObserver=null;
function resetBattleKitchen(){try{const w=kitchen.contentWindow;if(typeof w?.setCookBattleRules!=="function"||!room?.rules)return;w.setCookBattleRules(room.rules,!!room.players?.[id]?.submitted);cookStarted=true;lastKitchenValue=null;const tutorial=w.document.getElementById("tutorialBar");if(tutorial)tutorial.hidden=true;}catch(e){say("요리 초기화 오류: "+e.message)}}
function lockKitchen(score){try{kitchen.contentWindow?.lockCookBattle?.(score)}catch{}}
let submitting=false;
window.addEventListener("message",async e=>{
 if(e.origin!==location.origin||e.source!==kitchen.contentWindow||e.data?.type!=="fw-cook-battle-submit"||submitting||!active()||!cookStarted||room.players?.[id]?.submitted)return;
 const ev=e.data.evaluation;
 if(!ev||!Array.isArray(ev.dish)||!ev.dish.length||ev.dish.length>40||!room.rules)return;
 const allowed=new Set(room.rules.allowed),parts=ev.dish;
 if(parts.some(x=>!allowed.has(x.name)))return say("지정되지 않은 재료가 포함됐어요.");
 const meat=new Set(["닭고기","소고기","돼지고기","새우","오징어","달걀","연어"]),pasta=new Set(["스파게티 면","우동 면","라면 사리"]);
 const unique=new Set(parts.map(x=>x.name)),cookable=parts.filter(x=>meat.has(x.name)||pasta.has(x.name));
 const spoiled=parts.filter(x=>x.burnt||x.heat>=80||(meat.has(x.name)&&x.heat<45)).length;
 const m=[Math.min(1,unique.size/4),parts.filter(x=>x.cut||x.crushed).length/parts.length,ev.mixed?1:0,cookable.length?cookable.filter(x=>x.heat>=45&&x.heat<80&&!x.burnt).length/cookable.length:0,Math.min(1,unique.size/parts.length)];
 const score=Math.max(0,Math.min(100,Math.round(m.reduce((a,v,i)=>a+v*room.rules.weights[i],0)-spoiled*15)));
 submitting=true;
 try{const r=await runTransaction(roomRef(code),v=>{
  if(!v||v.phase!=="playing"||!v.players?.[id]||v.players[id].submitted||session.now()>=v.startedAt+duration)return;
  v.players[id].score=score;v.players[id].submitted=true;v.players[id].submittedAt=serverTimestamp();
  if(Object.values(v.players).length===2&&Object.values(v.players).every(p=>p.submitted)){v.phase="finished";v.finishedAt=serverTimestamp()}
  return v;
 },{applyLocally:false});
 if(r.committed){published=score;lockKitchen(score);say("🍽️ 최종 "+score+"점 제출 완료!");}
 else say("제출되지 않았어요. 시간 내에 다시 시도해 주세요.");
 }catch(err){say("제출 오류: "+err.message)}finally{submitting=false}
});

function listenKitchen(){if(room?.phase==="playing"&&!cookStarted)resetBattleKitchen()}
kitchen.addEventListener("load",listenKitchen);
let finishing=false;
setInterval(async()=>{
 if(!room)return;display();
 // Only final submissions may write a score.
 if(room.phase==="playing"&&timeLeft()===0&&!finishing){
  finishing=true;
  try{await runTransaction(roomRef(code),v=>{
   if(!v||v.phase!=="playing"||!v.players?.[id]||session.now()<v.startedAt+duration)return;
   // Include a local score earned before the deadline if its previous send failed.
   
   v.phase="finished";v.finishedAt=serverTimestamp();return v;
  },{applyLocally:false})}catch(e){say("종료 처리 실패: "+e.message)}finally{finishing=false}
 }
},1000);
(async()=>{if(!session.code)return;locked=true;try{await authReady();const saved=session.code,snap=await get(roomRef(saved));if(snap.val()?.players?.[id])subscribe(saved);else session.clear()}catch(e){error(e)}finally{locked=false}})();
</script></body></html>
