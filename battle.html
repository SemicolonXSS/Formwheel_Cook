<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formwheel Cook Battle</title><link rel="icon" href="https://semicolonxss.github.io/Formwheel/assets/formwheel-favicon.svg"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#243047;background:#f7f8fc}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dae1eb;padding:14px max(16px,calc((100vw - 1050px)/2))}a{color:#5267d5;text-decoration:none}main{max-width:1050px;margin:22px auto;padding:0 16px}.panel{padding:20px;background:#fff;border:1px solid #e1e6ed;border-radius:18px;margin:14px 0;box-shadow:0 3px 20px #2736540b}h1{margin:0 0 8px}p{color:#626b79}input{border:1px solid #ccd3e1;border-radius:10px;padding:12px;font-size:16px;max-width:100%}button{border:0;border-radius:12px;background:#5267d5;color:white;padding:12px 16px;font-size:15px;cursor:pointer;margin:4px}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#eef1ff;color:#3445a2}.hidden{display:none}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.stat{padding:13px;border-radius:12px;background:#f2f5fb;flex:1;min-width:140px}.num{font-size:30px;font-weight:800}#timer{font-variant-numeric:tabular-nums}.status{white-space:pre-wrap;background:#fff7e9;padding:10px;border-radius:9px}iframe{width:100%;height:760px;border:1px solid #dee2ed;border-radius:12px;background:white}#tap{font-size:33px;font-weight:800;min-height:170px;width:100%;margin:16px 0;background:#fe8b4b}#tap:active{transform:scale(.99)}@media(max-width:600px){iframe{height:650px}.num{font-size:24px}}</style></head><body>
<header><a href="./">← Cook 일반 모드</a> · <a href="https://semicolonxss.github.io/Formwheel/">Formwheel Hub</a></header><main><h1>🍳 요리 배틀</h1><p>5분 동안 자유롭게 요리해 최고 평가 점수가 높은 사람이 승리! · 1대1 온라인 대결</p>
<section class="panel" id="join"><label>닉네임 <input id="name" maxlength="14" placeholder="플레이어"></label><div class="row"><button id="create">방 만들기</button><input id="codeInput" maxlength="6" placeholder="6자리 방 코드" style="text-transform:uppercase"><button id="enter" class="secondary">방 참가</button></div><p id="joinStatus"></p></section>
<section class="panel hidden" id="room"><div class="row"><strong>방 코드: <span id="roomCode"></span></strong><button class="secondary" id="copy">코드 복사</button><button class="secondary" id="leave">방 나가기</button></div><div class="row"><div class="stat">나: <b id="myName"></b><div class="num" id="myScore">0</div></div><div class="stat">상대: <b id="theirName">대기 중</b><div class="num" id="theirScore">0</div></div><div class="stat">남은 시간<div class="num" id="timer">5:00</div></div></div><p id="phase"></p><button id="start" class="hidden">대결 시작</button><p class="status" id="message">상대를 기다리는 중...</p></section>
<section class="panel hidden" id="play"><p>기존 Cook 조리 시뮬레이터에서 요리하세요. <b>완성! 평가하기</b>를 누르면 그 점수가 배틀 최고 점수에 반영돼요. 여러 요리를 시도할 수 있어요.</p><iframe id="kitchen" title="Cook 배틀 요리 플레이" src="./index.html"></iframe></section>
</main><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getDatabase,ref,get,set,update,onValue,runTransaction,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
const app=initializeApp({apiKey:"AIzaSyBreTSe1m0-xlbF4aupnU5isRZCihR25IE",authDomain:"formwheel.firebaseapp.com",databaseURL:"https://formwheel-default-rtdb.firebaseio.com",projectId:"formwheel",appId:"1:431583088241:web:74e0e34ea1e3e1170c55d0"}),db=getDatabase(app),auth=getAuth(app),base="formwheelBattles/cook",duration=5*60000;
const $=id=>document.getElementById(id),id=sessionStorage.getItem("fw_cook_battle_id")||crypto.randomUUID();
sessionStorage.setItem("fw_cook_battle_id",id);
let code="",isHost=false,room=null,unsubscribe=null,published=-1,locked=false;
let score=0,money=0,power=1,auto=0,pc=20,ac=60,lastTick=Date.now(),cookStarted=false;
const safeName=s=>String(s||"플레이어").trim().slice(0,14)||"플레이어";
const roomRef=c=>ref(db,base+"/"+c);
function say(t){$("message").textContent=t}
function timeLeft(){return room?.startedAt?Math.max(0,duration-(Date.now()-room.startedAt)):duration}
function active(){return room?.phase==="playing"&&timeLeft()>0}
function display(){if(!room)return;const me=room.players?.[id];const opponent=Object.entries(room.players||{}).find(([k])=>k!==id)?.[1];$("myName").textContent=me?.name||"나";$("theirName").textContent=opponent?.name||"대기 중";$("myScore").textContent=(me?.score||0).toLocaleString();$("theirScore").textContent=(opponent?.score||0).toLocaleString();$("roomCode").textContent=code;const remaining=Math.ceil(timeLeft()/1000);$("timer").textContent=Math.floor(remaining/60)+":"+String(remaining%60).padStart(2,"0");$("start").classList.toggle("hidden",!isHost||room.phase!=="waiting"||Object.keys(room.players||{}).length!==2);$("play").classList.toggle("hidden",room.phase!=="playing");$("phase").textContent=room.phase==="waiting"?"대기실":room.phase==="playing"?"대결 진행 중":"대결 종료";
if(room.phase==="waiting")say("2명이 모이면 방장이 대결을 시작할 수 있어요.");
if(room.phase==="playing")say("현재 진행 중! 종료 시 더 높은 최고 점수가 승리합니다.");
if(room.phase==="finished"){const players=Object.entries(room.players||{});const sorted=players.slice().sort((a,b)=>(b[1].score||0)-(a[1].score||0));const tie=sorted.length===2&&sorted[0][1].score===sorted[1][1].score;say(sorted.length<2?"상대가 퇴장했어요.":tie?"🤝 무승부!":sorted[0]?.[0]===id?"🏆 승리!":"상대의 승리!");}
}
function subscribe(c){unsubscribe?.();code=c;$("join").classList.add("hidden");$("room").classList.remove("hidden");unsubscribe=onValue(roomRef(c),snap=>{const r=snap.val();if(!r){alert("방이 종료되었습니다.");location.reload();return}room=r;if(!r.players?.[id]){alert("방에서 퇴장했습니다.");location.reload();return}isHost=r.host===id;if(r.phase==="playing"&&!cookStarted)resetBattleKitchen();display()},err=>say("실시간 동기화 오류: "+err.message))}
async function authReady(){if(!auth.currentUser)await signInAnonymously(auth)}
function error(e){$("joinStatus").textContent="연결 실패: "+e.message+" (Firebase 인증 및 Database Rules 확인)"}
$("create").onclick=async()=>{if(locked)return;locked=true;try{await authReady();let c;for(let i=0;i<6;i++){c=Math.random().toString(36).slice(2,8).toUpperCase();const r=await runTransaction(roomRef(c),v=>v===null?{host:id,phase:"waiting",createdAt:Date.now(),players:{[id]:{name:safeName($("name").value),score:0}}}:undefined,{applyLocally:false});if(r.committed){subscribe(c);return}}throw Error("방 코드 생성에 실패했어요.")}catch(e){error(e)}finally{locked=false}};
$("enter").onclick=async()=>{if(locked)return;locked=true;try{await authReady();const c=$("codeInput").value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(c))throw Error("6자리 방 코드를 입력하세요.");const r=await runTransaction(roomRef(c),v=>{if(!v||v.phase!=="waiting")return;if(v.players?.[id])return v;if(Object.keys(v.players||{}).length>=2)return;v.players={...v.players,[id]:{name:safeName($("name").value),score:0}};return v},{applyLocally:false});if(!r.committed)throw Error("방이 없거나 이미 시작했거나 정원이 찼어요.");subscribe(c)}catch(e){error(e)}finally{locked=false}};
$("start").onclick=async()=>{if(!isHost||!room||Object.keys(room.players||{}).length!==2)return;try{const r=await runTransaction(roomRef(code),v=>{if(v?.host!==id||v.phase!=="waiting"||Object.keys(v.players||{}).length!==2)return;v.phase="playing";v.startedAt=Date.now();return v},{applyLocally:false});if(r.committed){score=money=0;power=1;auto=0;pc=20;ac=60;lastTick=Date.now();}}catch(e){say(e.message)}};
$("leave").onclick=async()=>{if(!code)return;try{await runTransaction(roomRef(code),v=>{if(!v?.players?.[id])return;delete v.players[id];if(!Object.keys(v.players).length)return null;if(v.host===id)v.host=Object.keys(v.players)[0];if(v.phase==="playing")v.phase="finished";return v},{applyLocally:false})}finally{location.href="./index.html"}};
$("copy").onclick=()=>navigator.clipboard.writeText(code);
async function publish(value){if(!active()||value<=published)return;published=value;try{await runTransaction(ref(db,base+"/"+code+"/players/"+id+"/score"),v=>Math.max(Number(v||0),value),{applyLocally:false})}catch(e){say("점수 전송 실패: "+e.message);published=-1}}
function increment(n){if(!active())return;money+=n;score=Math.max(score,money);publish(score);$("money").textContent=Math.floor(money).toLocaleString();}
const kitchen=$("kitchen");let lastKitchenValue=null;
function resetBattleKitchen(){try{const w=$("kitchen").contentWindow;if(typeof w.resetAll!=="function")return;w.resetAll();cookStarted=true;lastKitchenValue=null;}catch(e){say("요리 초기화 오류: "+e.message)}}
function listenKitchen(){if(room?.phase==="playing"&&!cookStarted)resetBattleKitchen();try{const doc=kitchen.contentDocument;if(!doc)return;const scoreElement=doc.getElementById("score");if(!scoreElement)return;const watch=()=>{if(!active())return;const s=scoreElement.textContent.trim();const n=Number(s);if(s!==lastKitchenValue&&/^\d+(?:\.\d+)?$/.test(s)&&Number.isFinite(n)&&n>=0&&n<=100){lastKitchenValue=s;publish(Math.max(published,n))}};new MutationObserver(watch).observe(scoreElement,{childList:true,characterData:true,subtree:true});watch();}catch(e){say("요리 점수 감지 오류: "+e.message)}}
kitchen.addEventListener("load",listenKitchen);
setInterval(async()=>{if(!room)return;display();if(room.phase==="playing"&&timeLeft()===0&&isHost){try{await runTransaction(roomRef(code),v=>{if(!v||v.phase!=="playing"||Date.now()<v.startedAt+duration)return;v.phase="finished";return v},{applyLocally:false})}catch(e){say("종료 처리 실패: "+e.message)}}

},500);
</script></body></html>
